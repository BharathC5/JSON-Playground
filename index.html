<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Architecture & Expression Workbench</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <h1>JSON Workbench</h1>
        <span class="version-badge">v2.0-arch</span>
      </div>
      <div class="topbar-actions">
        <label class="root-var-label">
          Root Var:
          <select id="rootVarSelect">
            <option value="data">data</option>
            <option value="item">item</option>
            <option value="response">response</option>
            <option value="result">result</option>
            <option value="__custom__">Custom&hellip;</option>
          </select>
          <input
            id="customRootInput"
            type="text"
            class="custom-root-input"
            placeholder="myVar"
            hidden
          />
        </label>
        <button id="settingsBtn" class="btn-small" title="Configure settings">
          ⚙ Settings
        </button>
      </div>
    </header>

    <main class="workspace-layout" id="workspaceLayout">
      <section class="panel panel-json" id="panelJson">
        <div class="panel-header">
          <span>PASTE JSON</span>
          <div class="panel-header-actions">
            <button
              id="formatBtn"
              class="btn-small"
              title="Pretty-print the JSON"
            >
              Format
            </button>
            <button id="minifyBtn" class="btn-small" title="Minify the JSON">
              Minify
            </button>
            <button
              id="resetBtn"
              class="btn-small btn-danger"
              title="Clear JSON and start over"
            >
              Reset
            </button>
          </div>
        </div>
        <textarea
          id="jsonInput"
          class="json-textarea"
          spellcheck="false"
          placeholder="Paste JSON payload here..."
        ></textarea>
        <div id="jsonError" class="json-error" hidden></div>
      </section>

      <div
        class="gutter gutter-vertical"
        id="gutterVertical"
        title="Drag to resize panels"
      ></div>

      <section class="panel panel-explorer" id="panelExplorer">
        <div class="panel-header">
          <span>EXPLORER &amp; VISUALIZER</span>
          <div class="view-toggle">
            <button
              id="viewTreeBtn"
              class="view-toggle-btn active"
              type="button"
            >
              Tree
            </button>
            <button id="viewFlowBtn" class="view-toggle-btn" type="button">
              Flowchart
            </button>
          </div>
        </div>
        <div class="explorer-search">
          <input
            id="propSearch"
            type="text"
            placeholder="Search keys, values, or deep properties (e.g. member, id)..."
          />
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <div id="treeContainer" class="tree-container"></div>
        <div id="flowContainer" class="flow-container" hidden></div>
        <div id="breadcrumb" class="breadcrumb" hidden>
          <div class="breadcrumb-header">
            <span class="breadcrumb-label">INSPECTED TARGET:</span>
            <button id="breadcrumbCopy" class="btn-small">Copy Path</button>
          </div>
          <div id="breadcrumbPath" class="breadcrumb-path"></div>
          <div class="breadcrumb-js-row">
            <code id="breadcrumbJs"></code>
          </div>
        </div>
      </section>
    </main>

    <div
      class="gutter gutter-horizontal"
      id="gutterHorizontal"
      title="Drag to resize console"
    ></div>

    <section class="panel panel-console" id="panelConsole">
      <div class="panel-header">
        <span>JS EXECUTION CONSOLE</span>
        <div class="panel-header-actions">
          <button id="clearConsoleBtn" class="btn-small">Clear</button>
        </div>
      </div>
      <div id="consoleOutput" class="console-output"></div>
      <div id="consoleSuggestions" class="console-suggestions" hidden></div>
      <div class="console-input-row">
        <span class="console-prompt">&gt;</span>
        <input
          id="consoleInput"
          type="text"
          class="console-input"
          placeholder="Type JS expression or iterate (e.g., data.member.forEach(...))"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </section>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-backdrop" hidden>
      <div class="modal-dialog">
        <div class="modal-header">
          <h2>Architect Settings</h2>
          <button id="closeSettingsBtn" class="btn-icon">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label class="setting-label" for="settingArrayCopyMode"
              >Array Access Pattern:</label
            >
            <select id="settingArrayCopyMode" class="setting-select">
              <option value="raw">
                Raw Index Access (e.g., data.member[0].id)
              </option>
              <option value="forEach">
                Iteration: forEach (data.member.forEach(item =&gt; item.id))
              </option>
              <option value="map">
                Iteration: map (data.member.map(item =&gt; item.id))
              </option>
              <option value="forOf">
                Loop: for...of (for (const item of data.member) { item.id })
              </option>
            </select>
            <span class="setting-help"
              >Determines how property paths inside arrays are formatted when
              copied or pushed to console.</span
            >
          </div>

          <div class="setting-group">
            <label class="setting-checkbox-label">
              <input type="checkbox" id="settingOptionalChaining" />
              Generate Safe Navigation / Optional Chaining (<code>?.</code>)
            </label>
          </div>

          <div class="setting-group">
            <label class="setting-checkbox-label">
              <input
                type="checkbox"
                id="settingShowMethodsInAutocomplete"
                checked
              />
              Show Prototype Methods in Console Autocomplete (.map, .filter,
              etc.)
            </label>
          </div>

          <div class="setting-group actions-group">
            <button id="resetLayoutBtn" class="btn-small">
              Reset Layout Splitters
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
